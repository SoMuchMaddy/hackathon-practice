<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HuskyFinance</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
<h1>Welcome to HuskyFinance!</h1>
<p>Our first Spring Boot webpage is working!</p>

<h2>Financial Summary</h2>

<div class="summary-cards">
    <p>Total Income: $<span id="total-income">0.00</span></p>
    <p>Total Expenses: $<span id="total-expenses">0.00</span></p>
    <p>Balance: $<span id="balance">0.00</span></p>
</div>

<h2>Add Transaction</h2>

<form id="transaction-form">
    <input id="description" placeholder="Description" required>
    <input id="amount" type="number" step="0.01"
           placeholder="Amount" required>

    <select id="type">
        <option value="EXPENSE">Expense</option>
        <option value="INCOME">Income</option>
    </select>

    <button type="submit">Add Transaction</button>
</form>

<h2>Transactions</h2>
<ul id="transaction-list"></ul>

<script>
    fetch('/api/transactions')
        .then(response => response.json())
        .then(transactions => {
            const list = document.getElementById('transaction-list');

            transactions.forEach(transaction => {
                const item = document.createElement('li');
                item.textContent =
                    `${transaction.description}: $${transaction.amount} (${transaction.type})`;
                const deleteButton = document.createElement('button');
                deleteButton.textContent = 'Delete';
                deleteButton.style.marginLeft = '15px';

                deleteButton.addEventListener('click', async () => {
                    const response = await fetch(`/api/transactions/${transaction.id}`, {
                        method: 'DELETE'
                    });

                    if (response.ok) {
                        window.location.reload();
                    } else {
                        alert('Failed to delete transaction.');
                    }
                });

                item.appendChild(deleteButton);
                list.appendChild(item);
            });
        });

    document.getElementById('transaction-form').addEventListener('submit', async function(event) {
        event.preventDefault();

        const transaction = {
            description: document.getElementById('description').value,
            amount: document.getElementById('amount').value,
            type: document.getElementById('type').value
        };

        const response = await fetch('/api/transactions', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(transaction)
        });

        if (response.ok) {
            window.location.reload();
        } else {
            alert('Failed to save transaction.');
        }
    });

    fetch('/api/transactions/summary')
        .then(response => response.json())
        .then(summary => {
            document.getElementById('total-income').textContent =
                summary.income.toFixed(2);

            document.getElementById('total-expenses').textContent =
                summary.expenses.toFixed(2);

            document.getElementById('balance').textContent =
                summary.balance.toFixed(2);
        });

</script>

</body>
</html>
